name: 页面或构建问题 / Bug report
description: Report a reproducible problem using publication-safe examples.
title: "[Bug] "
body:
  - type: markdown
    attributes:
      value: "请勿上传客户资料、内部地址、账号、密钥或未脱敏截图。Do not include private records, credentials or internal URLs."
  - type: input
    id: location
    attributes:
      label: 页面或模块 / Page or module
      description: "例如 /academy/zh/cases/；使用页面路径，不要填写私有服务器地址。"
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: 分支与版本 / Branch and commit
  - type: textarea
    id: reproduce
    attributes:
      label: 如何复现 / Steps to reproduce
      description: Include language, browser and viewport when relevant. Use synthetic data only.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: 预期与实际 / Expected and actual behavior
    validations:
      required: true
  - type: checkboxes
    id: privacy
    attributes:
      label: 内容检查 / Publication check
      options:
        - label: "附件和文字不含客户资料、密钥或内部地址。No private records, credentials or internal URLs are included."
          required: true
